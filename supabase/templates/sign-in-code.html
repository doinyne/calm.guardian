<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1a1c1c;background:#ffffff">
    <h1 style="font-size:20px;font-weight:600;margin:0 0 16px">Your Calm Guardian sign-in code</h1>
    <p style="font-size:16px;line-height:24px;margin:0 0 16px">Enter this code in the app to sign in:</p>
    <p style="font-size:32px;font-weight:600;letter-spacing:6px;margin:0 0 24px">{{ .Token }}</p>
    <p style="font-size:14px;line-height:20px;margin:0;color:#3f4948">
      If you didn't ask for this code, you can ignore this email. Nobody can sign in without it.
    </p>
  </body>
</html>
